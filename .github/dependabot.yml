# Propose chaque semaine une PR par mise à jour de dépendance ; le pipeline CI
# vérifie qu'elle ne casse rien avant la fusion.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Paquets publiés ensemble : une seule PR pour garder des versions alignées.
    groups:
      nestjs:
        patterns: ["@nestjs/*"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
    # Versions majeures du framework, de l'ORM et des types Node : à la main,
    # sur une branche dédiée. NestJS 12 (PR #39) cassait npm ci, @nestjs/throttler
    # n'acceptant pas encore cette version ; @types/node doit suivre la version
    # de Node réellement exécutée (22), pas la dernière publiée (PR #38).
    ignore:
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Image de base du Dockerfile (node:22-alpine).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Versions majeures de Node : à la main, de LTS en LTS (22, 24…). Dependabot
    # proposait Node 25, version impaire maintenue six mois seulement.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
